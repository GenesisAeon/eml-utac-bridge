[project]
name = "eml-utac-bridge"
version = "1.0.0"
description = "GenesisAeon Package 37: mathematical bridge showing UTAC, CREP, AFET, and the unified Lagrangian all reduce to finite binary trees of the single EML operator eml(x,y) = exp(x) - ln(y)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer" }]
requires-python = ">=3.11"
keywords = ["EML operator", "UTAC", "CREP", "GenesisAeon", "mathematical physics", "operator completeness"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "diamond-setup>=2.2.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
diamond = "diamond_setup.cli:app"

[project.urls]
Homepage = "https://github.com/GenesisAeon/eml-utac-bridge"
Repository = "https://github.com/GenesisAeon/eml-utac-bridge"
Documentation = "https://genesisaeon.github.io/eml-utac-bridge"
Issues = "https://github.com/GenesisAeon/eml-utac-bridge/issues"
Zenodo = "https://doi.org/10.5281/zenodo.17472834"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eml_utac_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

